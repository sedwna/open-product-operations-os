name: One-click launcher bundles

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-gate:
    name: Verify tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Match tag, package, and changelog versions
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          test "$GITHUB_REF_NAME" = "v$package_version"
          grep -F "## $package_version - " CHANGELOG.md

      - name: Install locked dependencies
        run: npm ci

      - name: Run complete release verification
        run: npm run check && npm run supply-chain && npm run packed:check

  bundle:
    name: Build ${{ matrix.name }} bundle
    needs: release-gate
    if: always() && (needs.release-gate.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: open-product-operations-os-windows
          - name: macOS
            os: macos-latest
            artifact: open-product-operations-os-macos
          - name: Linux
            os: ubuntu-latest
            artifact: open-product-operations-os-linux

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify launcher contracts
        run: npm run launchers:check

      - name: Build Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist, dist/stage -Force | Out-Null
          git archive --format=zip --output dist/source.zip HEAD
          Expand-Archive -LiteralPath dist/source.zip -DestinationPath dist/stage
          & dist/stage/launchers/windows/build.ps1 -Output dist/stage/launchers/windows/OpenProductOS.exe
          $hash = (Get-FileHash -LiteralPath dist/stage/launchers/windows/OpenProductOS.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  OpenProductOS.exe" | Set-Content -LiteralPath dist/stage/launchers/windows/OpenProductOS.exe.sha256 -Encoding ascii
          Compress-Archive -Path dist/stage/* -DestinationPath dist/${{ matrix.artifact }}.zip -CompressionLevel Optimal
          $bundleHash = (Get-FileHash -LiteralPath dist/${{ matrix.artifact }}.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$bundleHash  ${{ matrix.artifact }}.zip" | Set-Content -LiteralPath dist/${{ matrix.artifact }}.zip.sha256 -Encoding ascii

      - name: Build macOS or Linux bundle
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/stage
          git archive HEAD | tar -xf - -C dist/stage
          tar -czf "dist/${{ matrix.artifact }}.tar.gz" -C dist/stage .
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.tar.gz.sha256")
          fi

      - name: Upload verified bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish immutable GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - name: Download verified bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find release-assets -type f -print0 | sort -z)
          test "${#assets[@]}" -ge 6
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Open Product Operations OS $GITHUB_REF_NAME" \
            --generate-notes
