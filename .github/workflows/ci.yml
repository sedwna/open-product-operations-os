name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20, 22]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check syntax, tests, and portable hashes
        run: npm run check

      - name: Run CLI smoke test
        run: npm run smoke

      - name: Verify cross-host pack hash and installed CLI
        run: npm run packed:check

      - name: Verify ordinary Windows autocrlf clean clone
        if: runner.os == 'Windows' && matrix.node-version == 22
        run: npm run clean-clone:check

      - name: Verify clean Git archive package
        if: runner.os == 'Linux' && matrix.node-version == 22
        run: npm run clean-archive:check

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies, licenses, and generated SBOM
        run: npm run supply-chain
