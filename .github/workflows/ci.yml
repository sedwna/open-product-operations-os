name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20, 22]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check syntax, tests, and portable hashes
        run: npm run check

      - name: Run CLI smoke test
        run: npm run smoke

      - name: Verify cross-host pack hash and installed CLI
        run: npm run packed:check

      - name: Verify ordinary Windows autocrlf clean clone
        if: runner.os == 'Windows' && matrix.node-version == 22
        run: npm run clean-clone:check

      - name: Verify clean Git archive package
        if: runner.os == 'Linux' && matrix.node-version == 22
        run: npm run clean-archive:check

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies, licenses, and generated SBOM
        run: npm run supply-chain

  site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install locked site dependencies
        run: npm ci --prefix site

      - name: Audit site dependencies
        run: npm audit --prefix site --audit-level=high

      - name: Lint, build, and render-test the site
        run: npm run lint --prefix site && npm test --prefix site
